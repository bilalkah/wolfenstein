site_name: Last Signal from Karakale
site_description: >-
  A C++23 raycasting engine, native and in the browser, with an online
  deathmatch: the problems it solves, its stack, and its algorithms.
site_author: Bilal Kahraman
site_url: https://bilalkah.github.io/karakale/
repo_url: https://github.com/bilalkah/karakale
repo_name: bilalkah/karakale
edit_uri: edit/master/docs-site/
copyright: Code under the MIT licence; art and sounds from Freedoom (BSD) and others, see the repository's assets/licenses. Not affiliated with id Software or ZeniMax Media, whose trademarks Wolfenstein and DOOM are.

# The site's sources live in docs-site/: docs/ is kept for local notes and
# benchmark records, and is not in the repository
docs_dir: docs-site
site_dir: site

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.sections
    - navigation.instant
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-viewer.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  /assets/README.md

nav:
  - Home: index.md
  - Stack and why: stack.md
  - Architecture: architecture.md
  - Problems solved: problems.md
  - Algorithms: algorithms.md
  - Multiplayer: multiplayer.md
  - Building and hosting: building.md

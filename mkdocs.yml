site_name: Wolfenstein engine
site_description: >-
  How a small C++23 raycasting engine works, from the frame loop to the
  WebAssembly build: the design, the code, and why it is the way it is.
site_author: Bilal Kahraman
site_url: https://bilalkah.github.io/wolfenstein/
repo_url: https://github.com/bilalkah/wolfenstein
repo_name: bilalkah/wolfenstein
edit_uri: edit/master/docs-site/
copyright: Code under the MIT licence; art and sounds from Freedoom (BSD) and others, see the repository's assets/licenses.

# The site's sources live in docs-site/: docs/ is kept for local notes and
# benchmark records, and is not in the repository
docs_dir: docs-site
site_dir: site

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.sections
    - navigation.instant
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-viewer.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  /assets/README.md

nav:
  - Home: index.md
  - Architecture:
      - The big picture: architecture/index.md
      - One frame, input to pixels: architecture/frame-lifecycle.md
      - Data flow: architecture/data-flow.md
      - Ownership and lifetimes: architecture/ownership.md
  - Engine:
      - Subsystems: engine/index.md
      - Main loop and timing: engine/main-loop.md
      - Raycasting and the camera: engine/raycasting.md
      - The 3D renderer: engine/renderer.md
      - The map: engine/map.md
      - Collision and movement: engine/collision.md
      - Game objects and the scene: engine/entities.md
      - The player: engine/player.md
      - Enemy AI: engine/ai.md
      - Pathfinding: engine/navigation.md
      - Weapons and combat: engine/combat.md
      - Input: engine/input.md
      - Audio: engine/audio.md
      - Textures and animation: engine/assets.md
      - Levels and content data: engine/levels.md
      - Memory: engine/memory.md
      - UI, menus and HUD: engine/ui.md
      - Settings and saved games: engine/persistence.md
      - Profiling and testing: engine/profiling.md
      - Platform layer: engine/platform.md
  - Features:
      - How the game grew: features/index.md
      - The first raycaster: features/raycaster-origins.md
      - Sprites and animation: features/sprites-and-animation.md
      - Weapons: features/weapons.md
      - Rockets and plasma: features/projectiles.md
      - Where shots land: features/hit-detection.md
      - Enemy pathfinding: features/enemy-pathfinding.md
      - Enemy senses: features/enemy-senses.md
      - Combat tactics: features/combat-tactics.md
      - Menus and settings: features/menus-and-settings.md
      - The toolchain and CI: features/toolchain-and-ci.md
      - Playing in the browser: features/webassembly.md
      - Zero allocations per frame: features/zero-allocations.md
      - A World that owns the game: features/world-and-ownership.md
      - A deterministic simulation: features/deterministic-simulation.md
      - Content as data: features/data-driven-content.md
      - The campaign: features/campaign.md
      - Doors, keys and secrets: features/doors-keys-secrets.md
      - Pickups and drops: features/pickups-and-drops.md
      - The map of the level: features/map-and-exploration.md
      - Difficulty and saved games: features/difficulty-and-saves.md
      - Bodies that collide: features/collision-and-physics.md
      - Looking up and down: features/looking-up-and-down.md
      - Freedoom art and music: features/freedoom-art-and-music.md
      - Hearing where sounds are: features/positional-audio.md
      - Dying and hurting: features/death-and-feedback.md
      - Story and intel: features/story-and-intel.md
  - C++ techniques:
      - Techniques used here: techniques/index.md
      - Special members and pinned types: techniques/special-members.md
      - RAII and custom deleters: techniques/raii.md
      - Errors as values with std::expected: techniques/expected.md
      - Non-owning views: techniques/views.md
      - Polymorphic memory resources: techniques/pmr-arenas.md
      - Object pools and generational handles: techniques/object-pool.md
      - std::mdspan: techniques/mdspan.md
      - State machines with templates: techniques/state-machines.md

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolfenstein</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #ccc;
    font: 14px/1.4 system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* Keep the game's 4:3 frame, scaled to the largest size that fits */
  #canvas {
    display: block;
    width: min(100vw, calc(100vh * 4 / 3));
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    outline: none;
  }
  #loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(360px, 80vw);
    text-align: center;
  }
  #loader[hidden] { display: none; }
  #loader h1 {
    margin: 0 0 20px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: #c8201e;
  }
  #bar {
    height: 6px;
    background: #222;
    border-radius: 3px;
    overflow: hidden;
  }
  #fill {
    width: 0;
    height: 100%;
    background: #c8201e;
    transition: width 0.15s linear;
  }
  #status {
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  #loader.failed #fill { background: #555; }
</style>
</head>
<body>
<div id="loader">
  <h1>WOLFENSTEIN</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Loading…</div>
</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  const loaderEl = document.getElementById('loader');
  const fillEl = document.getElementById('fill');
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('canvas');

  // Download progress in bytes, [loaded, total], of the two big files
  const progress = { wasm: [0, 0], data: [0, 0] };
  let shownFraction = 0;
  const megabytes = (bytes) => (bytes / 1048576).toFixed(1);
  function showProgress() {
    // A download of unknown size (no Content-Length) is left out
    const known = [progress.wasm, progress.data].filter(([, total]) => total);
    const loaded = known.reduce((sum, [bytes]) => sum + bytes, 0);
    const total = known.reduce((sum, [, bytes]) => sum + bytes, 0);
    if (!total) return;
    // Totals become known one download at a time: never move backwards
    shownFraction = Math.max(shownFraction, Math.min(loaded / total, 1));
    fillEl.style.width = `${shownFraction * 100}%`;
    statusEl.textContent = loaded >= total
      ? 'Starting…'
      : `Loading ${megabytes(loaded)} / ${megabytes(total)} MB`;
  }

  // Downloads the big files in chunks over several connections at once, the
  // way download managers do: on some networks one connection stalls while
  // the others run at full speed, and a stalled chunk is simply asked for
  // again. A server that ignores ranges sends the whole file in one piece.
  const nativeFetch = window.fetch.bind(window);
  const kChunkBytes = 512 * 1024;
  const kStallMs = 1000;  // no bytes for this long: drop the connection
  const kMaxRetries = 20;

  // The connections the downloads share: a browser opens 6 per server, and
  // a request waiting for one must not count as stalled
  let freeConnections = 6;
  const waiting = [];
  async function withConnection(work) {
    if (freeConnections) {
      --freeConnections;
    }
    else {
      await new Promise((resolve) => waiting.push(resolve));
    }
    try {
      return await work();
    } finally {
      const next = waiting.shift();
      if (next) next();
      else ++freeConnections;
    }
  }

  // Bytes [start, end] of `url` in one request; throws if it stalls
  async function fetchRange(url, start, end, onBytes) {
    const controller = new AbortController();
    let timer = 0;
    const rearm = () => {
      clearTimeout(timer);
      timer = setTimeout(() => controller.abort(), kStallMs);
    };
    rearm();
    try {
      const response = await nativeFetch(url, {
        signal: controller.signal,
        headers: { Range: `bytes=${start}-${end}` },
      });
      if (!response.ok) {
        throw Object.assign(new Error(`${url}: HTTP ${response.status}`), { fatal: true });
      }
      const reader = response.body.getReader();
      const parts = [];
      let length = 0;
      for (;;) {
        rearm();
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        length += value.length;
        onBytes(length);
      }
      const bytes = new Uint8Array(length);
      let offset = 0;
      for (const part of parts) {
        bytes.set(part, offset);
        offset += part.length;
      }
      return { response, bytes };
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchRangeRetrying(url, start, end, onBytes) {
    for (let attempt = 0; ; ++attempt) {
      try {
        return await withConnection(() => fetchRange(url, start, end, onBytes));
      } catch (error) {
        onBytes(0);
        if (error.fatal || attempt >= kMaxRetries) throw error;
        console.warn(`${url}: bytes ${start}-${end} stalled, asking again`);
      }
    }
  }

  // Which build a response's bytes are from: its date (or tag)
  const stampOf = (response) =>
    response.headers.get('Last-Modified') ?? response.headers.get('ETag');

  // `url` as a Response whose body streams in order as the chunks arrive,
  // and the version of the file they are all from ("<size> <stamp>", null
  // if the server tells neither). A chunk from another build (the file was
  // rebuilt mid-download) fails the stream rather than mix the two.
  async function chunkedFetch(url, type, onProgress) {
    let total = 0;
    const received = [];
    const report = () => onProgress(received.reduce((sum, bytes) => sum + bytes, 0), total);
    const counter = (index) => (bytes) => {
      received[index] = bytes;
      report();
    };

    // The first chunk tells the file's size, or brings the whole file
    const first = await fetchRangeRetrying(url, 0, kChunkBytes - 1, counter(0));
    const size = /\/(\d+)$/.exec(first.response.headers.get('Content-Range') ?? '');
    const stamp = stampOf(first.response);
    const chunks = [Promise.resolve(first.bytes)];
    if (first.response.status === 206 && size) {
      total = Number(size[1]);
      for (let start = kChunkBytes; start < total; start += kChunkBytes) {
        const end = Math.min(start + kChunkBytes, total) - 1;
        const chunk = fetchRangeRetrying(url, start, end, counter(chunks.length))
          .then(({ response, bytes }) => {
            if (stampOf(response) !== stamp) {
              throw new Error(`${url} changed while it was downloading`);
            }
            return bytes;
          });
        chunk.catch(() => {});  // reported when the stream reaches it
        chunks.push(chunk);
      }
    }
    else {
      total = first.bytes.length;
    }
    report();

    let next = 0;
    const body = new ReadableStream({
      async pull(stream) {
        if (next === chunks.length) {
          stream.close();
          return;
        }
        try {
          stream.enqueue(await chunks[next++]);
        } catch (error) {
          stream.error(error);
        }
      },
    });
    const response = new Response(body, {
      headers: { 'Content-Type': type, 'Content-Length': String(total) },
    });
    return { response, version: stamp ? `${total} ${stamp}` : null };
  }

  // The downloaded files are kept in the browser and used again while the
  // server's copy is unchanged, so only the first visit after a build
  // downloads anything. IndexedDB, not the Cache API: that one needs https,
  // and the game is also played from plain http:// LAN addresses.
  // Version 2 forgets the copies version 1 kept: those could mix two builds
  const store = new Promise((resolve) => {
    try {
      const request = indexedDB.open('wolfenstein', 2);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (db.objectStoreNames.contains('files')) db.deleteObjectStore('files');
        db.createObjectStore('files');
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => resolve(null);
    } catch {
      resolve(null);  // storage turned off (some private windows)
    }
  });
  async function inStore(mode, action) {
    const db = await store;
    if (!db) return undefined;
    return new Promise((resolve, reject) => {
      const request = action(db.transaction('files', mode).objectStore('files'));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  // What identifies the server's copy of `url`: its size and date (or tag).
  // Null if the server tells neither, or does not answer.
  async function remoteVersion(url) {
    for (let attempt = 0; attempt < 3; ++attempt) {
      try {
        return await withConnection(async () => {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), kStallMs);
          try {
            const response = await nativeFetch(url, {
              method: 'HEAD', cache: 'no-store', signal: controller.signal,
            });
            const tag = stampOf(response);
            const size = response.headers.get('Content-Length');
            return response.ok && tag && size ? `${size} ${tag}` : null;
          } finally {
            clearTimeout(timer);
          }
        });
      } catch {
        // stalled: ask again
      }
    }
    return null;
  }

  async function cachedFetch(url, type, onProgress) {
    const version = await remoteVersion(url);
    if (version) {
      const kept = await inStore('readonly', (files) => files.get(url)).catch(() => undefined);
      if (kept?.version === version) {
        onProgress(kept.blob.size, kept.blob.size);
        return new Response(kept.blob, {
          headers: { 'Content-Type': type, 'Content-Length': String(kept.blob.size) },
        });
      }
    }
    const download = await chunkedFetch(url, type, onProgress);
    // Kept under the version its bytes came from, and only if they all
    // arrived: a failed or mixed download is fetched afresh next time
    if (!download.version) return download.response;
    const [forGame, forStore] = download.response.body.tee();
    new Response(forStore).blob()
      .then((blob) => inStore('readwrite', (files) =>
        files.put({ version: download.version, blob }, url)))
      .catch((error) => console.warn(`${url}: not kept for the next visit:`, error));
    return new Response(forGame, { headers: download.response.headers });
  }

  // A game that fails to start may have met a stale or broken copy of its
  // files: the page forgets its copies and loads afresh, once. Only a
  // second failure is shown.
  const kRecoveredKey = 'wolfenstein-recovered';
  const session = (() => {
    try { return window.sessionStorage; } catch { return null; }
  })();
  let recovering = false;
  let running = false;  // started: failures from now on are the game's
  let gameReady = false;  // the game loaded and began its loop
  async function recover(text) {
    if (recovering) return;
    if (running || session?.getItem(kRecoveredKey)) {
      fail(text);
      return;
    }
    recovering = true;
    session?.setItem(kRecoveredKey, '1');
    loaderEl.hidden = false;
    statusEl.textContent = 'Updating the game…';
    await inStore('readwrite', (files) => files.clear()).catch(() => {});
    location.reload();
  }

  // The data package is fetched by Emscripten's loader: give it the same
  // download
  window.fetch = (input, init) =>
    typeof input === 'string' && input.endsWith('index.data')
      ? cachedFetch(input, 'application/octet-stream', (loaded, total) => {
          progress.data = [loaded, total];
          showProgress();
        })
      : nativeFetch(input, init);

  function fail(text) {
    loaderEl.hidden = false;
    loaderEl.classList.add('failed');
    statusEl.textContent = text;
  }

  // ?benchmark[=frames] runs the performance benchmark, ?soak the scripted
  // session that checks nothing allocates after startup (see benchmarks/)
  const params = new URLSearchParams(location.search);
  const benchmarkArgs = params.has('benchmark')
    ? ['--benchmark', params.get('benchmark') || '']
    : params.has('soak') ? ['--soak'] : [];
  // ?debug: P shows the whole level in 2D (for developers)
  if (params.has('debug')) benchmarkArgs.push('--debug');

  var Module = {
    arguments: benchmarkArgs,
    canvas,
    setStatus(text) {
      // Downloads report their own progress; "" once the game runs
      if (!text) loaderEl.hidden = true;
    },
    // Streams the wasm in, compiling while it downloads
    instantiateWasm(imports, done) {
      cachedFetch('index.wasm', 'application/wasm', (loaded, total) => {
        progress.wasm = [loaded, total];
        showProgress();
      })
        .then((response) => WebAssembly.instantiateStreaming(response, imports))
        .then(({ instance, module }) => done(instance, module))
        .catch((error) => {
          console.error(error);
          recover('Could not load the game, see the browser console.');
        });
      return {};
    },
    onRuntimeInitialized() {
      // Read by the benchmark runner as the page's load time
      window.runtimeReadyMs = performance.now();
      // The game loads everything as it starts, straight after this, and
      // says so once loaded; one that exits instead (a broken file) stops
      // silently, so its silence is the failure
      setTimeout(() => {
        if (!gameReady) recover('The game could not start, see the browser console.');
      }, 1000);
      // Running: a later failure is the game's, not its files'
      setTimeout(() => {
        running = true;
        session?.removeItem(kRecoveredKey);
      }, 10000);
    },
    onGameReady() {
      gameReady = true;
    },
    onAbort() {
      recover('The game stopped, see the browser console.');
    },
    onExit(status) {
      if (status !== 0) recover('The game stopped, see the browser console.');
    },
  };
  window.onerror = () => recover('Something went wrong, see the browser console.');
  window.onunhandledrejection = () => {
    if (!running) recover('Something went wrong, see the browser console.');
  };

  // Browsers start audio suspended until the page gets a user gesture
  function resumeAudio() {
    const ctx = Module.SDL2 && Module.SDL2.audioContext;
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  for (const type of ['keydown', 'mousedown']) {
    document.addEventListener(type, resumeAudio);
  }
  canvas.addEventListener('mousedown', () => canvas.focus());
</script>
{{{ SCRIPT }}}
</body>
</html>

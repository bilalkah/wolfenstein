<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolfenstein</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #ccc;
    font: 14px/1.4 system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* Keep the game's 4:3 frame, scaled to the largest size that fits */
  #canvas {
    display: block;
    width: min(100vw, calc(100vh * 4 / 3));
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    outline: none;
  }
  #loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(360px, 80vw);
    text-align: center;
  }
  #loader[hidden] { display: none; }
  #loader h1 {
    margin: 0 0 20px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: #c8201e;
  }
  #bar {
    height: 6px;
    background: #222;
    border-radius: 3px;
    overflow: hidden;
  }
  #fill {
    width: 0;
    height: 100%;
    background: #c8201e;
    transition: width 0.15s linear;
  }
  #status {
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  #loader.failed #fill { background: #555; }
</style>
</head>
<body>
<div id="loader">
  <h1>WOLFENSTEIN</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Loading…</div>
</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  const loaderEl = document.getElementById('loader');
  const fillEl = document.getElementById('fill');
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('canvas');

  // Download progress in bytes, [loaded, total], of the two big files
  const progress = { wasm: [0, 0], data: [0, 0] };
  let shownFraction = 0;
  const megabytes = (bytes) => (bytes / 1048576).toFixed(1);
  function showProgress() {
    // A download of unknown size (no Content-Length) is left out
    const known = [progress.wasm, progress.data].filter(([, total]) => total);
    const loaded = known.reduce((sum, [bytes]) => sum + bytes, 0);
    const total = known.reduce((sum, [, bytes]) => sum + bytes, 0);
    if (!total) {
      // Sizes unknown (compressed on the way): how much has come so far
      const come = progress.wasm[0] + progress.data[0];
      if (come) statusEl.textContent = `Loading ${megabytes(come)} MB`;
      return;
    }
    // Totals become known one download at a time: never move backwards
    shownFraction = Math.max(shownFraction, Math.min(loaded / total, 1));
    fillEl.style.width = `${shownFraction * 100}%`;
    statusEl.textContent = loaded >= total
      ? 'Starting…'
      : `Loading ${megabytes(loaded)} / ${megabytes(total)} MB`;
  }

  // Downloads each big file in pieces over a few connections at once, as
  // download managers do. On a lossy network a TCP connection that hits a
  // bad patch backs off for seconds at a time (each retry waits twice as
  // long), even once the network recovers; a new connection does not. So a
  // piece that brings nothing for kStallMs is dropped (the server resets
  // its end, see scripts/serve_web.py) and the rest of it asked for again
  // from the byte it reached, on a new connection: nothing is fetched twice.
  const nativeFetch = window.fetch.bind(window);
  const kPieceBytes = 1024 * 1024;
  const kConnections = 4;
  const kStallMs = 2000;
  // Requests in a row that bring nothing before a piece is given up: any
  // progress starts the count again
  const kMaxRetries = 30;

  // Which build a response's bytes are from: its date (or tag)
  const stampOf = (response) =>
    response.headers.get('Last-Modified') ?? response.headers.get('ETag');
  const fatal = (text) => Object.assign(new Error(text), { fatal: true });
  const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  // Bytes [start, end] of `url` (of the build `stamp`) into `file`, however
  // many requests it takes; `onBytes` hears of every byte that arrives
  async function fetchPiece(url, stamp, file, start, end, onBytes) {
    let at = start;
    for (let idle = 0; at <= end;) {
      const before = at;
      const controller = new AbortController();
      let timer = 0;
      const rearm = () => {
        clearTimeout(timer);
        timer = setTimeout(() => controller.abort(), kStallMs);
      };
      try {
        rearm();
        const response = await nativeFetch(url, {
          cache: 'no-store',
          signal: controller.signal,
          headers: { Range: `bytes=${at}-${end}` },
        });
        if (response.status !== 206) {
          throw fatal(`${url}: HTTP ${response.status} for a range`);
        }
        if (stampOf(response) !== stamp) {
          throw fatal(`${url} changed while it was downloading`);
        }
        const reader = response.body.getReader();
        for (;;) {
          rearm();
          const { done, value } = await reader.read();
          if (done) break;
          if (at + value.length > end + 1) throw fatal(`${url}: more bytes than asked for`);
          file.set(value, at);
          at += value.length;
          onBytes(value.length);
        }
      } catch (error) {
        if (error.fatal) throw error;
      } finally {
        clearTimeout(timer);
        controller.abort();  // a stalled request: let its connection go
      }
      if (at <= end) {
        idle = at === before ? idle + 1 : 0;
        if (idle > kMaxRetries) throw new Error(`${url}: no bytes after ${kMaxRetries} tries`);
        console.warn(`${url}: bytes ${at}-${end} stalled, asking again`);
        await pause(100);
      }
    }
  }

  // `url` (`size` bytes of the build `stamp`) as a Response whose body
  // streams in order as its pieces complete
  function piecedFetch(url, type, size, stamp, onProgress) {
    const file = new Uint8Array(size);
    let received = 0;
    const onBytes = (bytes) => {
      received += bytes;
      onProgress(received, size);
    };
    const pieces = [];
    for (let start = 0; start < size; start += kPieceBytes) {
      let settle;
      const done = new Promise((resolve, reject) => { settle = { resolve, reject }; });
      done.catch(() => {});  // reported when the stream reaches it
      pieces.push({ start, end: Math.min(start + kPieceBytes, size) - 1, done, settle });
    }
    // A few workers take the pieces in order, one at a time each
    let next = 0;
    let failed = null;
    async function worker() {
      while (next < pieces.length && !failed) {
        const piece = pieces[next++];
        try {
          await fetchPiece(url, stamp, file, piece.start, piece.end, onBytes);
          piece.settle.resolve();
        } catch (error) {
          failed = error;
          piece.settle.reject(error);
        }
      }
      if (failed) pieces.forEach((piece) => piece.settle.reject(failed));
    }
    for (let i = 0; i < kConnections; ++i) worker();
    onProgress(0, size);

    let index = 0;
    const body = new ReadableStream({
      async pull(stream) {
        if (index === pieces.length) {
          stream.close();
          return;
        }
        const piece = pieces[index++];
        try {
          await piece.done;
          stream.enqueue(file.subarray(piece.start, piece.end + 1));
        } catch (error) {
          stream.error(error);
        }
      },
    });
    return new Response(body, {
      headers: { 'Content-Type': type, 'Content-Length': String(size) },
    });
  }

  // The downloaded files are kept in the browser and used again while the
  // server's copy is unchanged, so only the first visit after a build
  // downloads anything. IndexedDB, not the Cache API: that one needs https,
  // and the game is also played from plain http:// LAN addresses.
  // Version 2 forgets the copies version 1 kept: those could mix two builds
  const store = new Promise((resolve) => {
    try {
      const request = indexedDB.open('wolfenstein', 2);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (db.objectStoreNames.contains('files')) db.deleteObjectStore('files');
        db.createObjectStore('files');
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => resolve(null);
    } catch {
      resolve(null);  // storage turned off (some private windows)
    }
  });
  async function inStore(mode, action) {
    const db = await store;
    if (!db) return undefined;
    return new Promise((resolve, reject) => {
      const request = action(db.transaction('files', mode).objectStore('files'));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  // The server's copy of `url`: its size and date (or tag), which identify
  // it, and whether it can be fetched in pieces. Null if it tells neither,
  // or does not answer.
  async function remoteFile(url) {
    for (let attempt = 0; attempt < 5; ++attempt) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), kStallMs);
      try {
        const response = await nativeFetch(url, {
          method: 'HEAD', cache: 'no-store', signal: controller.signal,
        });
        const stamp = stampOf(response);
        const size = Number(response.headers.get('Content-Length'));
        if (!response.ok || !stamp || !size) return null;
        // A file the server compresses on the way (GitHub Pages gzips the
        // .wasm and the .data) cannot be fetched in pieces: a byte range is
        // of the compressed bytes, and Content-Length is theirs, not the
        // file's. It comes whole, and the browser inflates it.
        const compressed = Boolean(response.headers.get('Content-Encoding'));
        return {
          size,
          stamp,
          version: `${size} ${stamp}`,
          compressed,
          ranges: !compressed && response.headers.get('Accept-Ranges') === 'bytes',
        };
      } catch {
        // no answer: ask again
      } finally {
        clearTimeout(timer);
      }
    }
    return null;
  }

  // `url` whole, in one request, as the server sends it; `onProgress` hears
  // of its bytes as they arrive, of `remote.size` in all, or of an unknown
  // total if the server compresses them
  async function wholeFetch(url, type, remote, onProgress) {
    const response = await nativeFetch(url, { cache: 'no-store' });
    if (!response.ok || !response.body) return response;
    const total = remote.compressed ? 0 : remote.size;
    let received = 0;
    onProgress(0, total);
    const counted = response.body.pipeThrough(new TransformStream({
      transform(chunk, stream) {
        received += chunk.length;
        onProgress(received, total);
        stream.enqueue(chunk);
      },
    }));
    return new Response(counted, { headers: { 'Content-Type': type } });
  }

  async function cachedFetch(url, type, onProgress) {
    const remote = await remoteFile(url);
    if (!remote) return nativeFetch(url);  // unknown: fetched as it is
    const kept = await inStore('readonly', (files) => files.get(url)).catch(() => undefined);
    if (kept?.version === remote.version) {
      onProgress(kept.blob.size, kept.blob.size);
      return new Response(kept.blob, {
        headers: { 'Content-Type': type, 'Content-Length': String(kept.blob.size) },
      });
    }
    const response = remote.ranges
      ? piecedFetch(url, type, remote.size, remote.stamp, onProgress)
      : await wholeFetch(url, type, remote, onProgress);
    if (!response.ok) return response;
    // Kept only if every piece arrived: a failed download is fetched afresh
    // next time
    const [forGame, forStore] = response.body.tee();
    new Response(forStore).blob()
      .then((blob) => inStore('readwrite', (files) =>
        files.put({ version: remote.version, blob }, url)))
      .catch((error) => console.warn(`${url}: not kept for the next visit:`, error));
    return new Response(forGame, { headers: response.headers });
  }


  // A game that fails to start may have met a stale or broken copy of its
  // files: the page forgets its copies and loads afresh, once. Only a
  // second failure is shown.
  const kRecoveredKey = 'wolfenstein-recovered';
  const session = (() => {
    try { return window.sessionStorage; } catch { return null; }
  })();
  let recovering = false;
  let running = false;  // started: failures from now on are the game's
  let gameReady = false;  // the game loaded and began its loop
  async function recover(text) {
    if (recovering) return;
    if (running || session?.getItem(kRecoveredKey)) {
      fail(text);
      return;
    }
    recovering = true;
    session?.setItem(kRecoveredKey, '1');
    loaderEl.hidden = false;
    statusEl.textContent = 'Updating the game…';
    await inStore('readwrite', (files) => files.clear()).catch(() => {});
    location.reload();
  }

  // The data package is fetched by Emscripten's loader: give it the same
  // download
  window.fetch = (input, init) =>
    typeof input === 'string' && input.endsWith('index.data')
      ? cachedFetch(input, 'application/octet-stream', (loaded, total) => {
          progress.data = [loaded, total];
          showProgress();
        })
      : nativeFetch(input, init);

  function fail(text) {
    loaderEl.hidden = false;
    loaderEl.classList.add('failed');
    statusEl.textContent = text;
  }

  // ?benchmark[=frames] runs the performance benchmark, ?soak the scripted
  // session that checks nothing allocates after startup (see benchmarks/)
  const params = new URLSearchParams(location.search);
  const benchmarkArgs = params.has('benchmark')
    ? ['--benchmark', params.get('benchmark') || '']
    : params.has('soak') ? ['--soak'] : [];
  // ?debug: P shows the whole level in 2D (for developers)
  if (params.has('debug')) benchmarkArgs.push('--debug');

  var Module = {
    arguments: benchmarkArgs,
    canvas,
    setStatus(text) {
      // Downloads report their own progress; "" once the game runs
      if (!text) loaderEl.hidden = true;
    },
    // Streams the wasm in, compiling while it downloads
    instantiateWasm(imports, done) {
      cachedFetch('index.wasm', 'application/wasm', (loaded, total) => {
        progress.wasm = [loaded, total];
        showProgress();
      })
        .then((response) => WebAssembly.instantiateStreaming(response, imports))
        .then(({ instance, module }) => done(instance, module))
        .catch((error) => {
          console.error(error);
          recover('Could not load the game, see the browser console.');
        });
      return {};
    },
    onRuntimeInitialized() {
      // Read by the benchmark runner as the page's load time
      window.runtimeReadyMs = performance.now();
      // The game loads everything as it starts, straight after this, and
      // says so once loaded; one that exits instead (a broken file) stops
      // silently, so its silence is the failure
      setTimeout(() => {
        if (!gameReady) recover('The game could not start, see the browser console.');
      }, 1000);
      // Running: a later failure is the game's, not its files'
      setTimeout(() => {
        running = true;
        session?.removeItem(kRecoveredKey);
      }, 10000);
    },
    onGameReady() {
      gameReady = true;
    },
    onAbort() {
      recover('The game stopped, see the browser console.');
    },
    onExit(status) {
      if (status !== 0) recover('The game stopped, see the browser console.');
    },
  };
  window.onerror = () => recover('Something went wrong, see the browser console.');
  window.onunhandledrejection = () => {
    if (!running) recover('Something went wrong, see the browser console.');
  };

  // Browsers start audio suspended until the page gets a user gesture
  function resumeAudio() {
    const ctx = Module.SDL2 && Module.SDL2.audioContext;
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  for (const type of ['keydown', 'mousedown']) {
    document.addEventListener(type, resumeAudio);
  }
  canvas.addEventListener('mousedown', () => canvas.focus());

  // Raw mouse motion, free of the system's pointer acceleration, where the
  // browser offers it (unadjustedMovement); elsewhere the plain lock. The
  // game asks for the lock through SDL, which cannot pass the option.
  const lockPointer = canvas.requestPointerLock.bind(canvas);
  canvas.requestPointerLock = (options) => {
    let request;
    try {
      request = lockPointer({ ...options, unadjustedMovement: true });
    } catch {
      return lockPointer(options);
    }
    // Browsers that take options answer with a promise: turned down (raw
    // motion not offered here), the plain lock instead, still in the click
    return request?.catch?.(() => lockPointer(options)) ?? request;
  };
</script>

</body>
</html>

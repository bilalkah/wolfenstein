<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolfenstein</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #ccc;
    font: 14px/1.4 system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* Keep the game's 4:3 frame, scaled to the largest size that fits */
  #canvas {
    display: block;
    width: min(100vw, calc((100vh - 2.5em) * 4 / 3));
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    outline: none;
  }
  #status {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }
  #help {
    height: 2.5em;
    display: flex;
    align-items: center;
    opacity: .7;
  }
  kbd {
    margin: 0 .3em;
    padding: 0 .35em;
    border: 1px solid #666;
    border-radius: 3px;
  }
</style>
</head>
<body>
<div id="status">Loading…</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="help">
  Menu: <kbd>←</kbd><kbd>→</kbd> pick weapon, <kbd>Space</kbd> start ·
  Game: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move, mouse or <kbd>←</kbd><kbd>→</kbd> turn,
  click or <kbd>Ctrl</kbd> fire, <kbd>R</kbd> reload, <kbd>P</kbd> map view, <kbd>Esc</kbd> release mouse
</div>
<script>
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('canvas');

  var Module = {
    canvas,
    setStatus(text) {
      statusEl.textContent = text;
      statusEl.hidden = !text;
    },
    monitorRunDependencies(left) {
      if (left) Module.setStatus('Loading…');
    },
  };
  window.onerror = () => Module.setStatus('Something went wrong, see the browser console.');

  // Browsers start audio suspended until the page gets a user gesture
  function resumeAudio() {
    const ctx = Module.SDL2 && Module.SDL2.audioContext;
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  for (const type of ['keydown', 'mousedown']) {
    document.addEventListener(type, resumeAudio);
  }
  canvas.addEventListener('mousedown', () => canvas.focus());
</script>
{{{ SCRIPT }}}
</body>
</html>
